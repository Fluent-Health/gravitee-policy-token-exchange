name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set Maven version
        run: |
          mvn --batch-mode versions:set \
              -DnewVersion=${{ steps.version.outputs.version }} \
              -DgenerateBackupPoms=false

      - name: Unit tests
        run: mvn test --batch-mode -q

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false

      - name: Integration tests (Full-Stack Gravitee E2E)
        run: mvn verify -DskipTests=false --batch-mode -q

      - name: Build plugin ZIP
        run: |
          mvn package -DskipTests --batch-mode -q

      - name: Upload ZIP to GitHub Release
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            target/gravitee-policy-token-exchange-${{ steps.version.outputs.version }}.zip \
            --clobber

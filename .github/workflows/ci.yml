name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Unit tests
        run: mvn test -q

      - name: Build plugin ZIP
        run: mvn package -DskipTests -q

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: target/gravitee-policy-token-exchange-*.zip
          retention-days: 7

  # Container-backed E2E against each supported Gravitee version combination.
  # The matrix lives in .github/workflows/integration-matrix.yml so CI and
  # Release cannot drift apart.
  integration:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/integration-matrix.yml

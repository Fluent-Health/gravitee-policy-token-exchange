name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Unit tests
        run: mvn test -q

      - name: Integration tests (Full-Stack Gravitee E2E)
        run: mvn verify -DskipTests=false -q

      - name: Build plugin ZIP
        run: mvn package -DskipTests -q

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: target/gravitee-policy-token-exchange-*.zip
          retention-days: 7
